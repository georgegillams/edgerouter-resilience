[package]
name = "edgerouter_scripts"
version = "0.1.0"
edition = "2021"
description = "EdgeRouter maintenance scripts (WAN preference, log upload, remote commands)"

[lib]
name = "edgerouter_scripts"
path = "src/lib.rs"

[[bin]]
name = "auto-reset-pppoe"
path = "src/bin/auto_reset_pppoe.rs"

[[bin]]
name = "upload-reset-logs"
path = "src/bin/upload_reset_logs.rs"

[[bin]]
name = "execute-remote-commands"
path = "src/bin/execute_remote_commands.rs"

[profile.release]
panic = "abort"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
if-addrs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# rustls/ring does not support 32-bit big-endian MIPS; native-tls does.
ureq = { version = "3", default-features = false, features = ["native-tls", "json", "gzip"] }

# Statically link OpenSSL into the EdgeRouter musl binary. Host builds (macOS
# cargo test) keep using the platform TLS stack.
[target.mips-unknown-linux-musl.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }
